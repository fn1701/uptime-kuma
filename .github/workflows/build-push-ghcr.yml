name: Nightly Release

on:
  # push instead of upstream's schedule: this fork builds on every push, not nightly
  push:
  workflow_dispatch: # Allow manual trigger

permissions: {}

jobs:
  release-nightly:
    # Fork: run on this repository instead of upstream's own
    # if: github.repository == 'louislam/uptime-kuma'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with: { persist-credentials: false }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      # Fork: GHCR only, no Docker Hub
      # - name: Login to Docker Hub
      #   uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          # Fork: use the built-in GITHUB_TOKEN instead of upstream's dedicated GHCR_USERNAME/GHCR_TOKEN secrets
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 20
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 20

      #    Tempoary disable until we understand TanStack npm supply-chain compromise
      #      - name: Cache/Restore node_modules
      #        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      #        id: node-modules-cache
      #        with:
      #          path: node_modules
      #          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm clean-install --no-fund

      - name: Compute tags
        id: tags
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-')
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "branch_tag=${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "commit_tag=${SAFE_BRANCH}_${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Run release-nightly
        # Fork: extra/release/ghcr-patch.mjs builds the "release" target (not
        # nightly/nightly-rootless) tagged by branch/commit, pushed to GHCR only
        env:
          RELEASE_REPO_NAMES: ghcr.io/${{ github.repository_owner }}/uptime-kuma-ntfy-patch
          RELEASE_BRANCH_TAG: ${{ steps.tags.outputs.branch_tag }}
          RELEASE_COMMIT_TAG: ${{ steps.tags.outputs.commit_tag }}
        run: node ./extra/release/ghcr-patch.mjs
