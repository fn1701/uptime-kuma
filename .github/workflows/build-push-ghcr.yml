name: Nightly Release

on:
  # push instead of upstream's schedule: this fork builds on every push (branch
  # or tag), not nightly. A plain `push:` with no filter already covers tag
  # pushes (e.g. version tags like "2.5.5" synced in from upstream releases),
  # so the version-tag build below is handled in "Compute tags", not here.
  push:
  workflow_dispatch: # Allow manual trigger
    inputs:
      version_tag:
        description: >
          Optional version to publish this build under (e.g. "2.5.6"), for
          cases where the matching tag push didn't trigger a build (GitHub
          doesn't always fire push events for a tag pointing at a commit
          that's already on a branch).
        required: false
        type: string

permissions: {}

jobs:
  release-nightly:
    # Fork: run on this repository instead of upstream's own
    # if: github.repository == 'louislam/uptime-kuma'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with: { persist-credentials: false }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      # Fork: GHCR only, no Docker Hub
      # - name: Login to Docker Hub
      #   uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          # Fork: use the built-in GITHUB_TOKEN instead of upstream's dedicated GHCR_USERNAME/GHCR_TOKEN secrets
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 20
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 20

      #    Tempoary disable until we understand TanStack npm supply-chain compromise
      #      - name: Cache/Restore node_modules
      #        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      #        id: node-modules-cache
      #        with:
      #          path: node_modules
      #          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm clean-install --no-fund

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)

          TAG_NAME="${GITHUB_REF#refs/tags/}"
          INPUT_VERSION_TAG="${{ github.event.inputs.version_tag }}"

          # Only treat semver-looking tags (e.g. "2.5.5", "2.1.0-beta.2") as
          # version releases. Excludes the "synced-upstream" bookkeeping tag
          # that sync-upstream-release.yml force-pushes, which isn't a release.
          if [[ -n "$INPUT_VERSION_TAG" ]]; then
            # Manual workflow_dispatch override: GitHub doesn't always fire a
            # push event for a tag pointing at a commit already on a branch,
            # so this lets us publish that version's image on demand.
            SAFE_TAG=$(echo "$INPUT_VERSION_TAG" | tr '/' '-')
            echo "branch_tag=${SAFE_TAG}" >> "$GITHUB_OUTPUT"
            echo "commit_tag=${SAFE_TAG}_${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "version_tag=${SAFE_TAG}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* && "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            # Version tag push (e.g. a tag like "2.5.5" synced in from an
            # upstream release): use the tag name itself for branch_tag/commit_tag
            # (kept for ghcr-patch.mjs's required inputs) and also surface it
            # as version_tag so the image gets published under that version.
            SAFE_TAG=$(echo "$TAG_NAME" | tr '/' '-')
            echo "branch_tag=${SAFE_TAG}" >> "$GITHUB_OUTPUT"
            echo "commit_tag=${SAFE_TAG}_${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "version_tag=${SAFE_TAG}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Some other tag (e.g. synced-upstream): nothing to build, skip.
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
            SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-')
            echo "branch_tag=${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"
            echo "commit_tag=${SAFE_BRANCH}_${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run release-nightly
        if: steps.tags.outputs.skip != 'true'
        # Fork: extra/release/ghcr-patch.mjs builds the "release" target (not
        # nightly/nightly-rootless) tagged by branch/commit (and, on a version
        # tag push, the version too), pushed to GHCR only
        env:
          RELEASE_REPO_NAMES: ghcr.io/${{ github.repository_owner }}/uptime-kuma-ntfy-patch
          RELEASE_BRANCH_TAG: ${{ steps.tags.outputs.branch_tag }}
          RELEASE_COMMIT_TAG: ${{ steps.tags.outputs.commit_tag }}
          RELEASE_VERSION_TAG: ${{ steps.tags.outputs.version_tag }}
        run: node ./extra/release/ghcr-patch.mjs
