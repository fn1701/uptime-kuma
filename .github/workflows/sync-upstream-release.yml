name: Sync upstream release

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Get latest upstream release tag
        id: upstream
        run: |
          TAG=$(gh api repos/louislam/uptime-kuma/releases/latest -q .tag_name)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check last synced tag
        id: synced
        run: |
          git fetch origin 'refs/tags/synced-upstream' || true
          if git rev-parse -q --verify refs/tags/synced-upstream >/dev/null; then
            LAST=$(git tag -l --format='%(contents)' synced-upstream)
          else
            LAST=""
          fi
          echo "last=${LAST}" >> "$GITHUB_OUTPUT"

      - name: Merge new release
        id: merge
        if: steps.upstream.outputs.tag != steps.synced.outputs.last
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/louislam/uptime-kuma.git
          git fetch upstream "refs/tags/${{ steps.upstream.outputs.tag }}"

          git merge --no-edit "${{ steps.upstream.outputs.tag }}"

          git tag -f -a synced-upstream -m "${{ steps.upstream.outputs.tag }}"

          git push origin master
          git push origin refs/tags/synced-upstream --force

          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Use Node.js
        if: steps.merge.outputs.merged == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend dist (npm run build)
        if: steps.merge.outputs.merged == 'true'
        run: |
          npm ci
          npm run build

      - uses: docker/login-action@v3
        if: steps.merge.outputs.merged == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.merge.outputs.merged == 'true'
        with:
          context: .
          file: docker/dockerfile
          target: release
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/uptime-kuma-ntfy-patch:${{ steps.upstream.outputs.tag }}
